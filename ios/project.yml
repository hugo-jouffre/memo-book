name: MemoBook

# Le .xcodeproj n'est pas versionné : il se régénère depuis ce fichier avec
# `make project` (ou `xcodegen generate`). Cela évite les conflits Git sur le
# pbxproj et garde la structure du projet lisible en revue de code.

options:
  bundleIdPrefix: com.memobook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Team ID Apple Developer de Hugo. Nécessaire pour installer sur iPhone et
    # publier sur TestFlight.
    #
    # ⚠️ Ce n'est **pas** le nombre entre parenthèses du certificat
    # (« Apple Development: Hugo Jouffre (AB46433XZF) ») : celui-là identifie le
    # développeur. Le Team ID est l'unité d'organisation du certificat, et c'est
    # lui que Xcode attend — sinon la case Team affiche « Unknown name » et
    # « No Account for Team ». Pour le relire :
    #
    #   security find-certificate -c "Apple Development" -p | openssl x509 -noout -subject
    #   # → /UID=…/CN=Apple Development: … /OU=HP2A94889S/…   ← l'OU
    DEVELOPMENT_TEAM: HP2A94889S
    CODE_SIGN_STYLE: Automatic

packages:
  MemoBookKit:
    path: Modules

targets:
  MemoBook:
    type: application
    platform: iOS
    sources:
      - path: App
      # L'icône est un document Icon Composer : Xcode 26 en dérive lui-même
      # les variantes claire, sombre, teintée et le rendu « verre ». On la
      # déclare en fichier, sinon XcodeGen la traite comme un dossier de code.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MemoBook
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # L'app ne parle que français. Sans ces deux clés, iOS la considère
        # anglaise et `Locale.current` suit la langue de l'appareil : sur un
        # iPhone réglé en anglais, l'écran d'accueil affichait « 26 Aug–15 Sep »
        # au milieu d'une interface entièrement française. Les dates, les
        # nombres et les unités passent par `FormatStyle` : c'est cette locale
        # qu'ils lisent. La **région**, elle, reste celle de l'utilisateur —
        # un lecteur aux États-Unis lit bien des miles.
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
        # Catégorie App Store, celle que Xcode montre dans Identity ▸ App
        # Category. Elle vit ici et pas dans l'UI : la régler dans Xcode la
        # perdrait au prochain `make project`.
        LSApplicationCategoryType: public.app-category.travel
        # Écran de lancement : le logo sur le crème de la marque. Cette clé
        # n'accepte qu'une seule image et ne sait pas la décaler — pour un
        # motif de fond ou un logo hors centre, il faudra un storyboard.
        UILaunchScreen:
          UIColorName: LaunchBackgroundColor
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Sans ces deux descriptions, iOS refuse l'accès et l'app est rejetée
        # à la revue App Store.
        NSMicrophoneUsageDescription: >-
          MemoBook enregistre votre voix pour transformer vos souvenirs en carnet.
        NSPhotoLibraryUsageDescription: >-
          MemoBook ajoute vos photos aux pages de votre carnet.
        # L'API tourne en HTTP en développement local ; à retirer avant
        # publication, quand le back-end est derrière HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Capacités de l'app. Comme l'Info.plist, le fichier est **généré** depuis
    # ce bloc : c'est ce qui garantit qu'une capacité cochée dans Xcode ne
    # disparaisse pas à la régénération du projet. Une capacité s'ajoute ici,
    # jamais dans l'onglet Signing & Capabilities.
    entitlements:
      path: App/MemoBook.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memobook.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # La catégorie App Store est déclarée **deux fois**, et c'est voulu :
        #
        # - `LSApplicationCategoryType` dans l'Info.plist ci-dessus est ce qui
        #   part réellement dans le bundle signé ;
        # - ce réglage-ci est ce que lit l'onglet *General ▸ Identity* de Xcode.
        #   Sans lui l'UI affiche « None » même quand le plist est correct, et
        #   la corriger à la main dans Xcode la reperdrait au prochain
        #   `make project`.
        #
        # Les deux valeurs doivent rester identiques.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
    dependencies:
      - package: MemoBookKit
        product: MemoBookFeature

  MemoBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MemoBook
      - package: MemoBookKit
        product: MemoBookFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memobook.app.tests
        # Sans ça la cible ne signe pas et `xcodebuild test` refuse de démarrer.
        # Un bundle de tests n'a pas d'Info.plist à écrire à la main : on laisse
        # Xcode le générer.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MemoBook:
    build:
      targets:
        MemoBook: all
    run:
      config: Debug
      # Décocher/cocher dans Product ▸ Scheme ▸ Edit Scheme ▸ Run ▸ Arguments.
      # Coché, l'app repart à son tout premier démarrage — c'est ce qui permet
      # de revoir l'écran d'accueil, qu'un ⌘R ne réinitialise pas (Xcode
      # réinstalle par-dessus sans toucher au conteneur). Voir
      # `OnboardingStorage`.
      commandLineArguments:
        "-resetOnboarding": false
    test:
      config: Debug
      targets:
        - MemoBookTests
