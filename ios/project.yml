name: MemoBook

# Le .xcodeproj n'est pas versionné : il se régénère depuis ce fichier avec
# `make project` (ou `xcodegen generate`). Cela évite les conflits Git sur le
# pbxproj et garde la structure du projet lisible en revue de code.

options:
  bundleIdPrefix: com.memobook
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  MemoBookKit:
    path: Modules

targets:
  MemoBook:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MemoBook
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Polices de marque — à activer le jour où les fichiers arrivent dans
        # App/Resources/Fonts/ (voir « Polices » dans ios/README.md). Tant que
        # cette clé est absente, `MemoBookFont` retombe sur la police système :
        # la mise en page reste juste, seul le dessin des lettres diffère.
        # UIAppFonts:
        #   - Sora-Bold.ttf
        #   - Sora-SemiBold.ttf
        #   - GeneralSans-Regular.otf
        #   - GeneralSans-Medium.otf
        #   - GeneralSans-Semibold.otf
        # Sans ces deux descriptions, iOS refuse l'accès et l'app est rejetée
        # à la revue App Store.
        NSMicrophoneUsageDescription: >-
          MemoBook enregistre votre voix pour transformer vos souvenirs en carnet.
        NSPhotoLibraryUsageDescription: >-
          MemoBook ajoute vos photos aux pages de votre carnet.
        # L'API tourne en HTTP en développement local ; à retirer avant
        # publication, quand le back-end est derrière HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memobook.app
    dependencies:
      - package: MemoBookKit
        product: MemoBookFeature

  MemoBookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MemoBook
      - package: MemoBookKit
        product: MemoBookFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memobook.app.tests

schemes:
  MemoBook:
    build:
      targets:
        MemoBook: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemoBookTests
