<title>Inspecteur de mise en page — carnet MemoBook</title>
<style>
  /* ==========================================================================
     Chrome de l'inspecteur.
     Volontairement froid et sobre : les pages du carnet sont chaudes (crème,
     encre bleue, carotte). Le chrome doit se lire comme la table sur laquelle
     les feuilles sont posées, pas comme un décor concurrent.
     ========================================================================== */

  :root {
    --ground: #e7eaef;
    --ground-deep: #dcdfe6;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --ink: #161b23;
    --ink-soft: #5c6675;
    --ink-faint: #8b95a3;
    --line: #cfd5de;
    --accent: #f86015;          /* Carotte MemoBook : réservée à l'inspection */
    --accent-soft: rgba(248, 96, 21, .1);
    --wire: #0033a0;            /* L'encre du carnet : sert aux champs JSON */
    --wire-soft: rgba(0, 51, 160, .08);
    --mint: #2f7d6d;
    --mint-soft: rgba(175, 220, 211, .38);
    --shadow: 0 1px 2px rgba(18, 24, 34, .06), 0 8px 24px rgba(18, 24, 34, .07);
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10141b;
      --ground-deep: #0a0d13;
      --surface: #191f29;
      --surface-2: #212936;
      --ink: #e6eaf0;
      --ink-soft: #9aa5b5;
      --ink-faint: #6d788a;
      --line: #2c3543;
      --accent: #ff7734;
      --accent-soft: rgba(255, 119, 52, .13);
      --wire: #7fa2f5;
      --wire-soft: rgba(127, 162, 245, .12);
      --mint: #7dc4b4;
      --mint-soft: rgba(125, 196, 180, .14);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
    }
  }

  :root[data-theme="dark"] {
    --ground: #10141b;
    --ground-deep: #0a0d13;
    --surface: #191f29;
    --surface-2: #212936;
    --ink: #e6eaf0;
    --ink-soft: #9aa5b5;
    --ink-faint: #6d788a;
    --line: #2c3543;
    --accent: #ff7734;
    --accent-soft: rgba(255, 119, 52, .13);
    --wire: #7fa2f5;
    --wire-soft: rgba(127, 162, 245, .12);
    --mint: #7dc4b4;
    --mint-soft: rgba(125, 196, 180, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* --- Barre supérieure ---------------------------------------------------- */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 14px 22px;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 620; letter-spacing: -.01em; }

  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .seg {
    display: inline-flex;
    padding: 2px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .seg button {
    padding: 5px 11px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }

  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .zoom { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 12.5px; }
  .zoom input { width: 108px; accent-color: var(--accent); }
  .zoom output { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 38px; }

  /* --- Grille principale --------------------------------------------------- */
  .shell {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr) 330px;
    gap: 22px;
    align-items: start;
    padding: 22px;
    max-width: 1560px;
    margin: 0 auto;
  }

  /* --- Rail des pages ------------------------------------------------------ */
  nav { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 4px; }
  nav .eyebrow { padding: 0 8px 6px; }

  nav button {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }

  nav button:hover { background: var(--surface-2); color: var(--ink); }
  nav button.is-current { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
  nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav .n { font-size: 13px; font-weight: 560; }
  nav .d { font-size: 11px; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chip {
    align-self: flex-start;
    margin-top: 2px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--wire-soft);
    color: var(--wire);
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .04em;
  }

  /* --- Scène --------------------------------------------------------------- */
  .stage { display: flex; justify-content: center; overflow-x: auto; }
  .stage-inner { position: relative; }
  #frame { display: block; width: 560px; border: 0; transform-origin: top left; }

  /* --- Panneau d'inspection ------------------------------------------------ */
  aside {
    position: sticky;
    top: 74px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    max-height: calc(100vh - 96px);
    overflow-y: auto;
  }

  .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .panel-head h2 { margin: 3px 0 0; font-size: 17px; font-weight: 620; letter-spacing: -.015em; text-wrap: balance; }

  .kind {
    padding: 2px 7px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .kind[data-kind="page"]      { background: var(--accent-soft); color: var(--accent); }
  .kind[data-kind="composant"] { background: var(--mint-soft); color: var(--mint); }
  .kind[data-kind="structure"] { background: var(--wire-soft); color: var(--wire); }
  .kind[data-kind="decor"]     { background: var(--surface-2); color: var(--ink-faint); }

  .role { margin: 0; color: var(--ink-soft); font-size: 13px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field ul { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }

  code, .sel {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 2.5px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink);
    word-break: break-all;
  }
  .field.json code { background: var(--wire-soft); color: var(--wire); }
  .field.vars code { background: var(--accent-soft); color: var(--accent); }

  .ancestry { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .ancestry button {
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    cursor: pointer;
  }
  .ancestry button:hover { color: var(--accent); border-color: var(--accent); }
  .ancestry span { color: var(--ink-faint); font-size: 10px; }

  .copy {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 520;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .copy[data-done="1"] { border-color: var(--mint); color: var(--mint); }

  .hint { margin: 0; color: var(--ink-faint); font-size: 11.5px; }
  .hint kbd {
    padding: 1px 4px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    background: var(--surface-2);
    font-family: var(--mono);
    font-size: 10px;
  }

  .empty { display: flex; flex-direction: column; gap: 8px; padding: 6px 0 2px; }
  .empty p { margin: 0; color: var(--ink-soft); font-size: 13px; }

  hr { height: 1px; margin: 0; border: 0; background: var(--line); }

  @media (max-width: 1180px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    nav { position: static; flex-direction: row; flex-wrap: wrap; }
    nav .eyebrow { width: 100%; padding: 0 0 4px; }
    nav button { flex: 0 0 auto; }
    aside { position: static; max-height: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header>
  <div class="brand">
    <span class="eyebrow">MemoBook · carnet de voyage</span>
    <h1>Inspecteur de mise en page</h1>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Profil de sortie">
      <button type="button" id="p-preview" aria-pressed="true">Aperçu</button>
      <button type="button" id="p-print" aria-pressed="false">Imprimeur</button>
    </div>
    <label class="zoom">
      <span>Échelle</span>
      <input type="range" id="zoom" min="45" max="130" value="82" step="1" aria-label="Échelle d'affichage">
      <output id="zoom-out">82 %</output>
    </label>
  </div>
</header>

<div class="shell">
  <nav aria-label="Pages du carnet">
    <span class="eyebrow">Pages</span>
    <div id="rail"></div>
  </nav>

  <div class="stage">
    <div class="stage-inner" id="stage-inner">
      <iframe id="frame" title="Carnet rendu" scrolling="no"></iframe>
    </div>
  </div>

  <aside aria-live="polite">
    <div id="panel"></div>
  </aside>
</div>

<script>
  const PARTS = __PARTS__;
  const PAGES = __PAGES__;
</script>
<script type="application/json" id="doc-source">__DOCUMENT__</script>
<script>
(function () {
  "use strict";

  const frame = document.getElementById("frame");
  const stageInner = document.getElementById("stage-inner");
  const panel = document.getElementById("panel");
  const rail = document.getElementById("rail");
  const zoom = document.getElementById("zoom");
  const zoomOut = document.getElementById("zoom-out");

  /** Le document du carnet voyage en JSON : un <script> ne décode pas les entités. */
  const source = JSON.parse(document.getElementById("doc-source").textContent);

  let pinned = null;
  let hovered = null;
  let doc = null;
  let outline = null;

  // --- Rail ----------------------------------------------------------------
  PAGES.forEach((page) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.index = String(page.index);
    button.innerHTML =
      '<span class="n"></span><span class="d"></span><span class="chip"></span>';
    button.querySelector(".n").textContent = page.label;
    button.querySelector(".d").textContent = page.detail;
    button.querySelector(".chip").textContent = page.layout;
    button.addEventListener("click", () => goToPage(page.index));
    rail.appendChild(button);
  });

  function goToPage(index) {
    if (!doc) return;
    const target = doc.querySelectorAll(".page")[index];
    if (!target) return;
    const scale = Number(zoom.value) / 100;
    const top = stageInner.getBoundingClientRect().top + window.scrollY + target.offsetTop * scale;
    window.scrollTo({ top: top - 84, behavior: "smooth" });
  }

  // --- Échelle -------------------------------------------------------------
  function applyZoom() {
    const scale = Number(zoom.value) / 100;
    zoomOut.textContent = zoom.value + " %";
    frame.style.transform = "scale(" + scale + ")";
    if (doc) {
      const height = doc.documentElement.scrollHeight;
      frame.style.height = height + "px";
      stageInner.style.width = 560 * scale + "px";
      stageInner.style.height = height * scale + "px";
    }
  }
  zoom.addEventListener("input", applyZoom);

  // --- Profil --------------------------------------------------------------
  const buttons = { preview: document.getElementById("p-preview"), print: document.getElementById("p-print") };

  function setProfile(name) {
    if (!doc) return;
    doc.body.classList.toggle("is-print", name === "print");
    buttons.preview.setAttribute("aria-pressed", String(name === "preview"));
    buttons.print.setAttribute("aria-pressed", String(name === "print"));
  }
  buttons.preview.addEventListener("click", () => setProfile("preview"));
  buttons.print.addEventListener("click", () => setProfile("print"));

  // --- Inspection ----------------------------------------------------------

  /** Remonte l'arbre jusqu'au premier élément que le dictionnaire connaît. */
  function describe(element) {
    let node = element;
    while (node && node !== doc.body) {
      for (const cls of node.classList) {
        if (PARTS[cls]) return { node: node, key: cls, part: PARTS[cls] };
      }
      node = node.parentElement;
    }
    return null;
  }

  /** Chaîne des composants parents, du plus large au plus précis. */
  function ancestry(node) {
    const chain = [];
    let current = node;
    while (current && current !== doc.body) {
      for (const cls of current.classList) {
        if (PARTS[cls]) { chain.unshift({ key: cls, node: current }); break; }
      }
      current = current.parentElement;
    }
    return chain;
  }

  function moveOutline(node, isPinned) {
    if (!outline) return;
    const rect = node.getBoundingClientRect();
    const scroll = doc.defaultView;
    outline.style.display = "block";
    outline.classList.toggle("is-pinned", Boolean(isPinned));
    outline.style.left = rect.left + scroll.scrollX - 1.5 + "px";
    outline.style.top = rect.top + scroll.scrollY - 1.5 + "px";
    outline.style.width = rect.width + "px";
    outline.style.height = rect.height + "px";
  }

  function renderEmpty() {
    panel.innerHTML = "";
    const box = document.createElement("div");
    box.className = "empty";
    box.innerHTML =
      '<span class="eyebrow">Inspection</span>' +
      "<p>Survole n'importe quel élément d'une page : son nom, son sélecteur CSS et les champs JSON qui l'alimentent s'affichent ici.</p>" +
      '<p class="hint">Clique pour épingler, <kbd>Échap</kbd> pour relâcher.</p>';
    panel.appendChild(box);
  }

  function chipList(className, label, values) {
    if (!values || values.length === 0) return "";
    const items = values.map((v) => "<li><code>" + v + "</code></li>").join("");
    return (
      '<div class="field ' + className + '"><span class="eyebrow">' + label + "</span>" +
      "<ul>" + items + "</ul></div>"
    );
  }

  function render(found, isPinned) {
    const part = found.part;
    const chain = ancestry(found.node);

    panel.innerHTML =
      '<div class="panel-head"><div><span class="eyebrow">' +
      (isPinned ? "Épinglé" : "Survol") +
      '</span><h2></h2></div><span class="kind" data-kind="' + part.kind + '">' + part.kind + "</span></div>" +
      '<p class="role"></p>' +
      '<div class="field"><span class="eyebrow">Sélecteur</span><div><code class="sel">.' + found.key + "</code></div></div>" +
      chipList("json", "Champs du JSON", part.fields) +
      chipList("vars", "Variables CSS", part.vars) +
      '<div class="field"><span class="eyebrow">Contexte</span><div class="ancestry" id="chain"></div></div>' +
      "<hr>" +
      '<button type="button" class="copy" id="copy">Copier la référence</button>' +
      '<p class="hint">Colle-la dans ta demande de retouche : elle nomme le composant, son sélecteur et les champs concernés.</p>';

    panel.querySelector("h2").textContent = part.name;
    panel.querySelector(".role").textContent = part.role;

    const chainBox = panel.querySelector("#chain");
    chain.forEach((step, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.textContent = "›";
        chainBox.appendChild(sep);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = PARTS[step.key].name;
      button.addEventListener("click", () => {
        pinned = { node: step.node, key: step.key, part: PARTS[step.key] };
        render(pinned, true);
        moveOutline(step.node, true);
      });
      chainBox.appendChild(button);
    });

    panel.querySelector("#copy").addEventListener("click", (event) => {
      const lines = [
        "Composant : " + part.name,
        "Sélecteur : ." + found.key,
        "Rôle : " + part.role,
      ];
      if (part.fields) lines.push("Champs JSON : " + part.fields.join(", "));
      if (part.vars) lines.push("Variables CSS : " + part.vars.join(", "));
      lines.push("Fichiers : templates/travel-journal/index.html + style.css");

      navigator.clipboard.writeText(lines.join("\\n")).then(() => {
        const button = event.currentTarget;
        button.dataset.done = "1";
        button.textContent = "Référence copiée";
        setTimeout(() => {
          button.dataset.done = "";
          button.textContent = "Copier la référence";
        }, 1600);
      });
    });
  }

  // --- Chargement du carnet dans l'iframe -----------------------------------
  frame.addEventListener("load", () => {
    doc = frame.contentDocument;
    outline = doc.getElementById("mb-outline");
    applyZoom();
    renderEmpty();

    doc.addEventListener("mousemove", (event) => {
      const found = describe(event.target);
      if (!found) return;
      if (hovered === found.node) return;
      hovered = found.node;
      if (!pinned) { render(found, false); moveOutline(found.node, false); }
    });

    doc.addEventListener("click", (event) => {
      const found = describe(event.target);
      if (!found) return;
      event.preventDefault();
      pinned = found;
      render(found, true);
      moveOutline(found.node, true);
    });

    doc.addEventListener("mouseleave", () => {
      if (!pinned && outline) outline.style.display = "none";
    });

    // Suit la page visible dans le rail.
    const pages = Array.from(doc.querySelectorAll(".page"));
    const mark = () => {
      const scale = Number(zoom.value) / 100;
      const origin = stageInner.getBoundingClientRect().top;
      let current = 0;
      pages.forEach((page, i) => {
        if (origin + page.offsetTop * scale < 140) current = i;
      });
      rail.querySelectorAll("button").forEach((b, i) => b.classList.toggle("is-current", i === current));
    };
    window.addEventListener("scroll", mark, { passive: true });
    mark();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && pinned) {
      pinned = null;
      renderEmpty();
      if (outline) outline.style.display = "none";
    }
  });

  window.addEventListener("resize", applyZoom);

  frame.srcdoc = source;
})();
</script>
