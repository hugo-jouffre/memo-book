<title>Inspecteur de mise en page — carnet MemoBook</title>
<style>
  /* ==========================================================================
     Chrome de l'inspecteur.

     Volontairement froid et sobre : les pages du carnet sont chaudes (crème,
     encre bleue, carotte). Le chrome doit se lire comme la table sur laquelle
     les feuilles sont posées, pas comme un décor concurrent.

     Contrainte de forme : la page doit rester utilisable dans un panneau
     latéral étroit. D'où une barre compacte qui ne quitte jamais l'écran, et
     un panneau d'inspection en surcouche plutôt qu'en colonne — sur 400 px de
     large, une colonne de plus finit toujours tout en bas.
     ========================================================================== */

  :root {
    --ground: #e7eaef;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --ink: #161b23;
    --ink-soft: #5c6675;
    --ink-faint: #8b95a3;
    --line: #cfd5de;
    --accent: #f86015;          /* Carotte MemoBook : réservée à l'inspection */
    --accent-soft: rgba(248, 96, 21, .1);
    --wire: #0033a0;            /* L'encre du carnet : sert aux champs JSON */
    --wire-soft: rgba(0, 51, 160, .08);
    --mint: #2f7d6d;
    --mint-soft: rgba(175, 220, 211, .38);
    --shadow: 0 1px 2px rgba(18, 24, 34, .06), 0 8px 24px rgba(18, 24, 34, .07);
    --shadow-lift: 0 -2px 10px rgba(18, 24, 34, .08), 0 -12px 40px rgba(18, 24, 34, .1);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --bar: 46px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10141b;
      --surface: #191f29;
      --surface-2: #212936;
      --ink: #e6eaf0;
      --ink-soft: #9aa5b5;
      --ink-faint: #6d788a;
      --line: #2c3543;
      --accent: #ff7734;
      --accent-soft: rgba(255, 119, 52, .13);
      --wire: #7fa2f5;
      --wire-soft: rgba(127, 162, 245, .12);
      --mint: #7dc4b4;
      --mint-soft: rgba(125, 196, 180, .14);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
      --shadow-lift: 0 -2px 10px rgba(0, 0, 0, .35), 0 -14px 44px rgba(0, 0, 0, .45);
    }
  }

  :root[data-theme="dark"] {
    --ground: #10141b;
    --surface: #191f29;
    --surface-2: #212936;
    --ink: #e6eaf0;
    --ink-soft: #9aa5b5;
    --ink-faint: #6d788a;
    --line: #2c3543;
    --accent: #ff7734;
    --accent-soft: rgba(255, 119, 52, .13);
    --wire: #7fa2f5;
    --wire-soft: rgba(127, 162, 245, .12);
    --mint: #7dc4b4;
    --mint-soft: rgba(125, 196, 180, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
    --shadow-lift: 0 -2px 10px rgba(0, 0, 0, .35), 0 -14px 44px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* --- Barre : compacte, toujours à l'écran -------------------------------- */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    height: var(--bar);
    padding: 0 10px;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  header::-webkit-scrollbar { display: none; }

  .mark {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  @media (max-width: 940px) { .mark { display: none; } }

  .grow { flex: 1 1 auto; min-width: 4px; }

  select, .btn {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  select { max-width: 190px; }
  @media (max-width: 620px) { select { max-width: 132px; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .counter {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  /* Sur écran étroit, le numéro est déjà dans le sélecteur et en pied de page :
     le garder ici pousserait le sélecteur de profil hors de la barre. */
  @media (max-width: 620px) { .counter { display: none; } }

  .seg { display: inline-flex; flex: 0 0 auto; padding: 2px; background: var(--surface-2);
         border: 1px solid var(--line); border-radius: 7px; }
  .seg button { height: 22px; padding: 0 9px; border: 0; border-radius: 5px; background: transparent;
                color: var(--ink-soft); font: inherit; font-size: 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .zoom { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
  .zoom input { width: 84px; accent-color: var(--accent); }
  @media (max-width: 620px) { .zoom { display: none; } }

  /* --- Scène --------------------------------------------------------------- */
  .stage { display: flex; justify-content: center; padding: 14px 10px 0; overflow-x: auto; }
  .stage-inner { position: relative; }
  #frame { display: block; width: 560px; border: 0; transform-origin: top left; }

  /* Laisse la place au panneau, qui est en surcouche. */
  .spacer { height: 46vh; }
  @media (min-width: 1100px) { .spacer { height: 40px; } }

  /* --- Panneau d'inspection ------------------------------------------------ */
  /* Toujours en surcouche : en colonne, il tomberait sous les pages et il
     faudrait faire défiler tout le carnet pour lire le nom d'un composant. */
  #panel {
    position: fixed;
    z-index: 50;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 46vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: var(--shadow-lift);
  }

  @media (min-width: 1100px) {
    .stage { padding-right: 358px; }
    #panel {
      left: auto;
      top: calc(var(--bar) + 14px);
      right: 14px;
      bottom: 14px;
      width: 330px;
      max-height: none;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
  }

  .panel-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
  }
  @media (min-width: 1100px) { .panel-bar { cursor: default; } }

  .panel-bar h2 { flex: 1 1 auto; margin: 0; font-size: 14.5px; font-weight: 620;
                  letter-spacing: -.01em; white-space: nowrap; overflow: hidden;
                  text-overflow: ellipsis; }

  .kind { flex: 0 0 auto; padding: 2px 6px; border-radius: 4px; font-family: var(--mono);
          font-size: 9px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .kind[data-kind="page"]      { background: var(--accent-soft); color: var(--accent); }
  .kind[data-kind="composant"] { background: var(--mint-soft); color: var(--mint); }
  .kind[data-kind="structure"] { background: var(--wire-soft); color: var(--wire); }
  .kind[data-kind="decor"]     { background: var(--surface-2); color: var(--ink-faint); }

  .caret { flex: 0 0 auto; color: var(--ink-faint); font-size: 11px; transition: transform .18s; }
  #panel.is-collapsed .caret { transform: rotate(180deg); }
  #panel.is-collapsed .panel-body { display: none; }
  @media (min-width: 1100px) { .caret { display: none; } }

  .panel-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 12px;
                padding: 12px; overflow-y: auto; }

  .role { margin: 0; color: var(--ink-soft); font-size: 12.5px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field ul { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }

  code {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2.5px 6px;
    border-radius: 4px;
    background: var(--surface-2);
    color: var(--ink);
    word-break: break-all;
  }
  .field.json code { background: var(--wire-soft); color: var(--wire); }
  .field.vars code { background: var(--accent-soft); color: var(--accent); }

  .ancestry { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .ancestry button { padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px;
                     background: var(--surface-2); color: var(--ink-soft);
                     font-family: var(--mono); font-size: 10px; cursor: pointer; }
  .ancestry button:hover { color: var(--accent); border-color: var(--accent); }
  .ancestry span { color: var(--ink-faint); font-size: 10px; }

  .copy { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--surface-2); color: var(--ink); font: inherit; font-size: 12.5px;
          font-weight: 520; cursor: pointer; }
  .copy:hover { border-color: var(--accent); color: var(--accent); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .copy[data-state="done"] { border-color: var(--mint); color: var(--mint); }

  /* Dernier recours quand le presse-papier est refusé : le texte, sélectionnable. */
  .fallback { display: none; flex-direction: column; gap: 6px; }
  .fallback.is-shown { display: flex; }
  .fallback textarea {
    width: 100%; min-height: 108px; padding: 8px; resize: vertical;
    border: 1px solid var(--accent); border-radius: 6px;
    background: var(--surface-2); color: var(--ink);
    font-family: var(--mono); font-size: 11px; line-height: 1.45;
  }

  .hint { margin: 0; color: var(--ink-faint); font-size: 11px; }
  .hint kbd { padding: 1px 4px; border: 1px solid var(--line); border-bottom-width: 2px;
              border-radius: 3px; background: var(--surface-2); font-family: var(--mono); font-size: 10px; }

  hr { height: 1px; margin: 0; border: 0; background: var(--line); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <span class="mark">MemoBook · inspecteur</span>

  <button type="button" class="btn" id="prev" aria-label="Page précédente">‹</button>
  <select id="pages" aria-label="Aller à une page"></select>
  <button type="button" class="btn" id="next" aria-label="Page suivante">›</button>
  <span class="counter" id="counter">1 / 1</span>

  <span class="grow"></span>

  <div class="seg" role="group" aria-label="Profil de sortie">
    <button type="button" id="p-preview" aria-pressed="true">Aperçu</button>
    <button type="button" id="p-print" aria-pressed="false">Imprimeur</button>
  </div>

  <label class="zoom">
    <span class="eyebrow">Échelle</span>
    <input type="range" id="zoom" min="40" max="130" value="78" step="1" aria-label="Échelle d'affichage">
  </label>
</header>

<div class="stage">
  <div class="stage-inner" id="stage-inner">
    <iframe id="frame" title="Carnet rendu" scrolling="no"></iframe>
  </div>
</div>
<div class="spacer"></div>

<section id="panel" aria-live="polite">
  <div class="panel-bar" id="panel-bar">
    <h2 id="panel-title">Inspection</h2>
    <span class="kind" id="panel-kind" data-kind="decor" hidden></span>
    <span class="caret">▾</span>
  </div>
  <div class="panel-body" id="panel-body"></div>
</section>

<script>
  const PARTS = __PARTS__;
  const PAGES = __PAGES__;
</script>
<script type="application/json" id="doc-source">__DOCUMENT__</script>
<script>
(function () {
  "use strict";

  const frame = document.getElementById("frame");
  const stageInner = document.getElementById("stage-inner");
  const panel = document.getElementById("panel");
  const panelTitle = document.getElementById("panel-title");
  const panelKind = document.getElementById("panel-kind");
  const body = document.getElementById("panel-body");
  const select = document.getElementById("pages");
  const counter = document.getElementById("counter");
  const zoom = document.getElementById("zoom");

  /** Le document du carnet voyage en JSON : un <script> ne décode pas les entités. */
  const source = JSON.parse(document.getElementById("doc-source").textContent);

  let doc = null;
  let outline = null;
  let pinned = null;
  let hovered = null;
  let pageEls = [];
  let current = 0;

  // --- Navigation ----------------------------------------------------------
  PAGES.forEach((page) => {
    const option = document.createElement("option");
    option.value = String(page.index);
    option.textContent = `${page.index + 1}. ${page.label} · ${page.layout}`;
    select.appendChild(option);
  });

  function goToPage(index) {
    const target = pageEls[index];
    if (!target) return;
    const scale = Number(zoom.value) / 100;
    const top = stageInner.getBoundingClientRect().top + window.scrollY + target.offsetTop * scale;
    window.scrollTo({ top: top - 56, behavior: "smooth" });
  }

  select.addEventListener("change", () => goToPage(Number(select.value)));
  document.getElementById("prev").addEventListener("click", () => goToPage(Math.max(0, current - 1)));
  document.getElementById("next").addEventListener("click", () =>
    goToPage(Math.min(PAGES.length - 1, current + 1)));

  function setCurrent(index) {
    current = index;
    counter.textContent = `${index + 1} / ${PAGES.length}`;
    select.value = String(index);
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("next").disabled = index === PAGES.length - 1;
  }

  // --- Échelle -------------------------------------------------------------
  function applyZoom() {
    const scale = Number(zoom.value) / 100;
    frame.style.transform = `scale(${scale})`;
    if (!doc) return;
    const height = doc.documentElement.scrollHeight;
    frame.style.height = `${height}px`;
    stageInner.style.width = `${560 * scale}px`;
    stageInner.style.height = `${height * scale}px`;
  }
  zoom.addEventListener("input", applyZoom);
  window.addEventListener("resize", applyZoom);

  /** Sur un panneau étroit, on part à une échelle qui montre la page entière. */
  function fitZoom() {
    const available = document.querySelector(".stage").clientWidth - 20;
    const value = Math.round(Math.min(110, Math.max(40, (available / 560) * 100)));
    zoom.value = String(value);
  }

  // --- Profil --------------------------------------------------------------
  const profiles = { preview: document.getElementById("p-preview"), print: document.getElementById("p-print") };
  function setProfile(name) {
    if (!doc) return;
    doc.body.classList.toggle("is-print", name === "print");
    profiles.preview.setAttribute("aria-pressed", String(name === "preview"));
    profiles.print.setAttribute("aria-pressed", String(name === "print"));
  }
  profiles.preview.addEventListener("click", () => setProfile("preview"));
  profiles.print.addEventListener("click", () => setProfile("print"));

  // --- Repli du panneau sur écran étroit -----------------------------------
  document.getElementById("panel-bar").addEventListener("click", () => {
    if (window.innerWidth >= 1100) return;
    panel.classList.toggle("is-collapsed");
  });

  // --- Inspection ----------------------------------------------------------
  function describe(element) {
    let node = element;
    while (node && node !== doc.body) {
      for (const cls of node.classList) if (PARTS[cls]) return { node, key: cls, part: PARTS[cls] };
      node = node.parentElement;
    }
    return null;
  }

  function ancestry(node) {
    const chain = [];
    let cursor = node;
    while (cursor && cursor !== doc.body) {
      for (const cls of cursor.classList) {
        if (PARTS[cls]) { chain.unshift({ key: cls, node: cursor }); break; }
      }
      cursor = cursor.parentElement;
    }
    return chain;
  }

  /** Numéro de la page qui contient l'élément inspecté. */
  function pageOf(node) {
    const page = node.closest(".page");
    const index = pageEls.indexOf(page);
    return index === -1 ? null : index;
  }

  function moveOutline(node, isPinned) {
    if (!outline) return;
    const rect = node.getBoundingClientRect();
    outline.style.display = "block";
    outline.classList.toggle("is-pinned", Boolean(isPinned));
    outline.style.left = `${rect.left + doc.defaultView.scrollX - 1.5}px`;
    outline.style.top = `${rect.top + doc.defaultView.scrollY - 1.5}px`;
    outline.style.width = `${rect.width}px`;
    outline.style.height = `${rect.height}px`;
  }

  /**
   * Copie la référence.
   *
   * `navigator.clipboard` est refusé dans une iframe sans permission explicite,
   * ce qui est le cas ici. On tente l'API, puis la commande historique, et en
   * dernier recours on affiche le texte : mieux vaut deux gestes qu'un bouton
   * qui ne fait rien.
   */
  function copyText(text, button, fallbackBox, fallbackArea) {
    const done = () => {
      button.dataset.state = "done";
      button.textContent = "Référence copiée";
      setTimeout(() => { button.dataset.state = ""; button.textContent = "Copier la référence"; }, 1800);
    };

    const legacy = () => {
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
      document.body.appendChild(area);
      area.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      area.remove();
      return ok;
    };

    const reveal = () => {
      fallbackArea.value = text;
      fallbackBox.classList.add("is-shown");
      fallbackArea.focus();
      fallbackArea.select();
      button.textContent = "Sélectionne puis copie";
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => { if (legacy()) done(); else reveal(); });
      return;
    }
    if (legacy()) done(); else reveal();
  }

  function chipList(className, label, values) {
    if (!values || values.length === 0) return "";
    return `<div class="field ${className}"><span class="eyebrow">${label}</span><ul>` +
      values.map((v) => `<li><code>${v}</code></li>`).join("") + "</ul></div>";
  }

  function renderEmpty() {
    panelTitle.textContent = "Inspection";
    panelKind.hidden = true;
    body.innerHTML =
      "<p class=\"role\">Survole n'importe quel élément d'une page : son nom, son sélecteur CSS " +
      "et les champs JSON qui l'alimentent s'affichent ici.</p>" +
      "<p class=\"hint\">Clique pour épingler, <kbd>Échap</kbd> pour relâcher.</p>";
  }

  function render(found, isPinned) {
    const part = found.part;
    const page = pageOf(found.node);
    const pageLabel = page === null ? "" : `page ${page + 1} · ${PAGES[page].label}`;

    panelTitle.textContent = part.name;
    panelKind.hidden = false;
    panelKind.textContent = part.kind;
    panelKind.dataset.kind = part.kind;

    body.innerHTML =
      `<span class="eyebrow">${isPinned ? "Épinglé" : "Survol"}${pageLabel ? ` · ${pageLabel}` : ""}</span>` +
      `<p class="role"></p>` +
      `<div class="field"><span class="eyebrow">Sélecteur</span><div><code>.${found.key}</code></div></div>` +
      chipList("json", "Champs du JSON", part.fields) +
      chipList("vars", "Variables CSS", part.vars) +
      `<div class="field"><span class="eyebrow">Contexte</span><div class="ancestry" id="chain"></div></div>` +
      `<hr>` +
      `<button type="button" class="copy" id="copy">Copier la référence</button>` +
      `<div class="fallback" id="fallback"><span class="eyebrow">À copier à la main</span>` +
      `<textarea id="fallback-text" readonly></textarea></div>` +
      `<p class="hint">Colle-la dans ta demande de retouche : elle nomme le composant, ` +
      `sa page, son sélecteur et les champs concernés.</p>`;

    body.querySelector(".role").textContent = part.role;

    const chainBox = body.querySelector("#chain");
    ancestry(found.node).forEach((step, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.textContent = "›";
        chainBox.appendChild(sep);
      }
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = PARTS[step.key].name;
      button.addEventListener("click", () => {
        pinned = { node: step.node, key: step.key, part: PARTS[step.key] };
        render(pinned, true);
        moveOutline(step.node, true);
      });
      chainBox.appendChild(button);
    });

    const lines = [
      `Composant : ${part.name}`,
      pageLabel ? `Page : ${pageLabel}` : null,
      `Sélecteur : .${found.key}`,
      `Rôle : ${part.role}`,
      part.fields ? `Champs JSON : ${part.fields.join(", ")}` : null,
      part.vars ? `Variables CSS : ${part.vars.join(", ")}` : null,
      "Fichiers : templates/travel-journal/index.html + style.css",
    ].filter(Boolean).join("\n");

    const button = body.querySelector("#copy");
    button.addEventListener("click", () =>
      copyText(lines, button, body.querySelector("#fallback"), body.querySelector("#fallback-text")));
  }

  // --- Chargement ----------------------------------------------------------
  frame.addEventListener("load", () => {
    doc = frame.contentDocument;
    outline = doc.getElementById("mb-outline");
    pageEls = Array.from(doc.querySelectorAll(".page"));

    // Numéro sur chaque feuille : posé ici, pas dans le gabarit, qui doit
    // rester exactement ce qui part chez APITemplate.
    const style = doc.createElement("style");
    style.textContent =
      ".mb-pagenum{position:absolute;z-index:9;left:0;right:0;bottom:9px;text-align:center;" +
      "font:600 8px/1 ui-monospace,monospace;letter-spacing:.16em;color:rgba(43,35,27,.34);" +
      "pointer-events:none}";
    doc.head.appendChild(style);
    pageEls.forEach((page, i) => {
      const tag = doc.createElement("div");
      tag.className = "mb-pagenum";
      tag.textContent = `${i + 1} / ${pageEls.length}`;
      page.appendChild(tag);
    });

    fitZoom();
    applyZoom();
    setCurrent(0);
    renderEmpty();

    doc.addEventListener("mousemove", (event) => {
      const found = describe(event.target);
      if (!found || hovered === found.node) return;
      hovered = found.node;
      if (!pinned) { render(found, false); moveOutline(found.node, false); }
    });

    doc.addEventListener("click", (event) => {
      const found = describe(event.target);
      if (!found) return;
      event.preventDefault();
      pinned = found;
      panel.classList.remove("is-collapsed");
      render(found, true);
      moveOutline(found.node, true);
    });

    doc.addEventListener("mouseleave", () => {
      if (!pinned && outline) outline.style.display = "none";
    });

    const track = () => {
      const scale = Number(zoom.value) / 100;
      const origin = stageInner.getBoundingClientRect().top;
      let index = 0;
      pageEls.forEach((page, i) => { if (origin + page.offsetTop * scale < 120) index = i; });
      if (index !== current) setCurrent(index);
    };
    window.addEventListener("scroll", track, { passive: true });
    track();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && pinned) {
      pinned = null;
      renderEmpty();
      if (outline) outline.style.display = "none";
    }
  });

  frame.srcdoc = source;
})();
</script>
