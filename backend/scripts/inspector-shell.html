<title>Inspecteur de mise en page — carnet MemoBook</title>
<style>
  /* ==========================================================================
     Chrome de l'inspecteur.

     Volontairement froid et sobre : les pages du carnet sont chaudes (crème,
     encre bleue, carotte). Le chrome doit se lire comme la table sur laquelle
     les feuilles sont posées, pas comme un décor concurrent.

     Contrainte de forme : la page doit rester utilisable dans un panneau
     latéral étroit. D'où une barre compacte qui ne quitte jamais l'écran, et
     un panneau d'inspection en surcouche plutôt qu'en colonne — sur 400 px de
     large, une colonne de plus finit toujours tout en bas.
     ========================================================================== */

  :root {
    --ground: #e7eaef;
    --surface: #ffffff;
    --surface-2: #f4f6f9;
    --ink: #161b23;
    --ink-soft: #5c6675;
    --ink-faint: #8b95a3;
    --line: #cfd5de;
    --accent: #f86015;          /* Carotte MemoBook : réservée à l'inspection */
    --accent-soft: rgba(248, 96, 21, .1);
    --wire: #0033a0;            /* L'encre du carnet : sert aux champs JSON */
    --wire-soft: rgba(0, 51, 160, .08);
    --mint: #2f7d6d;
    --mint-soft: rgba(175, 220, 211, .38);
    --shadow: 0 1px 2px rgba(18, 24, 34, .06), 0 8px 24px rgba(18, 24, 34, .07);
    --shadow-lift: 0 -2px 10px rgba(18, 24, 34, .08), 0 -12px 40px rgba(18, 24, 34, .1);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --bar: 46px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10141b;
      --surface: #191f29;
      --surface-2: #212936;
      --ink: #e6eaf0;
      --ink-soft: #9aa5b5;
      --ink-faint: #6d788a;
      --line: #2c3543;
      --accent: #ff7734;
      --accent-soft: rgba(255, 119, 52, .13);
      --wire: #7fa2f5;
      --wire-soft: rgba(127, 162, 245, .12);
      --mint: #7dc4b4;
      --mint-soft: rgba(125, 196, 180, .14);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
      --shadow-lift: 0 -2px 10px rgba(0, 0, 0, .35), 0 -14px 44px rgba(0, 0, 0, .45);
    }
  }

  :root[data-theme="dark"] {
    --ground: #10141b;
    --surface: #191f29;
    --surface-2: #212936;
    --ink: #e6eaf0;
    --ink-soft: #9aa5b5;
    --ink-faint: #6d788a;
    --line: #2c3543;
    --accent: #ff7734;
    --accent-soft: rgba(255, 119, 52, .13);
    --wire: #7fa2f5;
    --wire-soft: rgba(127, 162, 245, .12);
    --mint: #7dc4b4;
    --mint-soft: rgba(125, 196, 180, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .34);
    --shadow-lift: 0 -2px 10px rgba(0, 0, 0, .35), 0 -14px 44px rgba(0, 0, 0, .45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  /* --- Barre : compacte, toujours à l'écran -------------------------------- */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 8px;
    height: var(--bar);
    padding: 0 10px;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    scrollbar-width: none;
  }
  header::-webkit-scrollbar { display: none; }

  .mark {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  @media (max-width: 940px) { .mark { display: none; } }

  .grow { flex: 1 1 auto; min-width: 4px; }

  select, .btn {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  select { max-width: 190px; }
  @media (max-width: 620px) { select { max-width: 132px; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .counter {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  /* Sur écran étroit, le numéro est déjà dans le sélecteur et en pied de page :
     le garder ici pousserait le sélecteur de profil hors de la barre. */
  @media (max-width: 620px) { .counter { display: none; } }

  .seg { display: inline-flex; flex: 0 0 auto; padding: 2px; background: var(--surface-2);
         border: 1px solid var(--line); border-radius: 7px; }
  .seg button { height: 22px; padding: 0 9px; border: 0; border-radius: 5px; background: transparent;
                color: var(--ink-soft); font: inherit; font-size: 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .zoom { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
  .zoom input { width: 84px; accent-color: var(--accent); }

  /* État occupé de l'export : le décodage du PDF fige brièvement le rendu. */
  .btn.is-busy svg { animation: mb-spin .7s linear infinite; }
  @keyframes mb-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .btn.is-busy svg { animation: none; opacity: .5; } }
  @media (max-width: 620px) { .zoom { display: none; } }

  /* --- Scène --------------------------------------------------------------- */
  .stage { display: flex; justify-content: center; padding: 14px 10px 0; overflow-x: auto; }
  .stage-inner { position: relative; }
  #frame { display: block; width: 560px; border: 0; transform-origin: top left; }

  .spacer { height: 24px; }

  /* --- Modal d'inspection --------------------------------------------------
     Posée dans le coin bas droit, elle n'apparaît qu'au clic et reste petite :
     l'important à l'écran, c'est la page, pas l'outil. Légèrement translucide
     pour qu'on voie ce qu'il y a dessous. */
  #dock { position: fixed; z-index: 50; right: 14px; bottom: 14px; display: none; }
  #dock.is-open { display: block; }

  #panel {
    position: relative;
    width: 296px;
    max-width: calc(100vw - 28px);
    max-height: calc(100vh - 84px);
    display: flex;
    flex-direction: column;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* La croix vit hors de la boîte, pour ne pas manger de sa largeur utile. */
  #close {
    position: absolute; top: -10px; right: -10px; z-index: 51;
    width: 22px; height: 22px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--surface); color: var(--ink-soft);
    font: 600 12px/1 var(--sans); cursor: pointer; box-shadow: var(--shadow);
  }
  #close:hover { color: var(--accent); border-color: var(--accent); }
  #close:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel-head { display: flex; align-items: center; gap: 7px; padding: 9px 11px 0; }
  .panel-head h2 { flex: 1 1 auto; margin: 0; font-size: 13.5px; font-weight: 620;
                   letter-spacing: -.01em; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; }

  .kind { flex: 0 0 auto; padding: 2px 5px; border-radius: 4px; font-family: var(--mono);
          font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase; white-space: nowrap; }
  .kind[data-kind="page"]      { background: var(--accent-soft); color: var(--accent); }
  .kind[data-kind="composant"] { background: var(--mint-soft); color: var(--mint); }
  .kind[data-kind="structure"] { background: var(--wire-soft); color: var(--wire); }
  .kind[data-kind="decor"]     { background: var(--surface-2); color: var(--ink-faint); }

  .panel-body { display: flex; flex-direction: column; gap: 8px; padding: 8px 11px 11px;
                overflow-y: auto; }

  .sel { display: block; width: 100%; padding: 6px 7px; border-radius: 5px;
         background: var(--surface-2); color: var(--ink);
         font-family: var(--mono); font-size: 10.5px; line-height: 1.4; word-break: break-all; }

  .row { display: flex; gap: 6px; }
  .row .copy { flex: 1 1 auto; }

  .copy, .more { padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--surface); color: var(--ink); font: inherit; font-size: 11.5px;
    font-weight: 520; cursor: pointer; white-space: nowrap; }
  .copy:hover, .more:hover { border-color: var(--accent); color: var(--accent); }
  .copy:focus-visible, .more:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .copy[data-state="done"] { border-color: var(--mint); color: var(--mint); }

  /* Le détail n'apparaît qu'à la demande : par défaut la modal tient en
     quatre lignes et laisse voir la page. */
  .detail { display: none; flex-direction: column; gap: 8px; }
  #dock.is-expanded .detail { display: flex; }

  .role { margin: 0; color: var(--ink-soft); font-size: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field ul { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }

  code { font-family: var(--mono); font-size: 10.5px; padding: 2px 5px; border-radius: 4px;
         background: var(--surface-2); color: var(--ink); word-break: break-all; }
  .field.json code { background: var(--wire-soft); color: var(--wire); }
  .field.vars code { background: var(--accent-soft); color: var(--accent); }

  .ancestry { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; }
  .ancestry button { padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px;
                     background: var(--surface-2); color: var(--ink-soft);
                     font-family: var(--mono); font-size: 9.5px; cursor: pointer; }
  .ancestry button:hover { color: var(--accent); border-color: var(--accent); }
  .ancestry span { color: var(--ink-faint); font-size: 9.5px; }

  .fallback { display: none; }
  .fallback.is-shown { display: block; }
  .fallback textarea { width: 100%; min-height: 48px; padding: 6px; resize: vertical;
    border: 1px solid var(--accent); border-radius: 5px; background: var(--surface-2);
    color: var(--ink); font-family: var(--mono); font-size: 10.5px; }

  .hint { margin: 0; color: var(--ink-faint); font-size: 10.5px; }

  /* Retour de l'export. Une iframe sans `allow-downloads` avale le
     téléchargement sans un mot : ce bandeau est là pour que le bouton cesse
     d'être muet quand il ne peut pas aboutir. */
  #export-note {
    display: none;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--accent-soft);
    color: var(--ink);
    font: 400 12px/1.45 var(--sans);
  }

  #export-note.is-open { display: flex; }
  #export-note strong { font-weight: 620; }
  #export-note a,
  #export-note .note-link {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
  }

  #export-note-text { flex: 1 1 auto; }
  #export-note code { font: 11px/1 var(--mono); background: rgb(0 0 0 / .06); padding: 1px 4px; border-radius: 4px; }

  #export-note-close {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }

  #export-note-close:hover { background: rgb(0 0 0 / .06); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <span class="mark">MemoBook · inspecteur</span>

  <button type="button" class="btn" id="prev" aria-label="Page précédente">‹</button>
  <select id="pages" aria-label="Aller à une page"></select>
  <button type="button" class="btn" id="next" aria-label="Page suivante">›</button>
  <span class="counter" id="counter">1 / 1</span>

  <span class="grow"></span>

  <div class="seg" role="group" aria-label="Profil de sortie">
    <button type="button" id="p-preview" aria-pressed="true">Aperçu</button>
    <button type="button" id="p-print" aria-pressed="false">Imprimeur</button>
  </div>

  <label class="zoom">
    <span class="eyebrow">Échelle</span>
    <input type="range" id="zoom" min="40" max="130" value="78" step="1" aria-label="Échelle d'affichage">
  </label>

  <button type="button" class="btn" id="export"
          title="Exporter le PDF au profil affiché (choisis « Enregistrer au format PDF »)"
          aria-label="Exporter en PDF">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    </svg>
  </button>
</header>

<!-- Retour de l'export. Masqué tant qu'il n'y a rien à dire. -->
<div id="export-note" role="status" aria-live="polite">
  <span id="export-note-text"></span>
  <button type="button" id="export-note-close" aria-label="Fermer">×</button>
</div>

<div class="stage">
  <div class="stage-inner" id="stage-inner">
    <iframe id="frame" title="Carnet rendu" scrolling="no"></iframe>
  </div>
</div>
<div class="spacer"></div>

<div id="dock">
  <button type="button" id="close" aria-label="Fermer l'inspection">×</button>
  <section id="panel" aria-live="polite">
    <div class="panel-head">
      <h2 id="panel-title">Inspection</h2>
      <span class="kind" id="panel-kind" data-kind="composant"></span>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </section>
</div>

<script>
  const PARTS = __PARTS__;
  const PAGES = __PAGES__;
</script>
<script type="application/json" id="doc-source">__DOCUMENT__</script>
<script type="application/json" id="pdf-source">__PDFS__</script>
<script>
(function () {
  "use strict";

  const frame = document.getElementById("frame");
  const stageInner = document.getElementById("stage-inner");
  const dock = document.getElementById("dock");
  const panelTitle = document.getElementById("panel-title");
  const panelKind = document.getElementById("panel-kind");
  const body = document.getElementById("panel-body");
  const select = document.getElementById("pages");
  const counter = document.getElementById("counter");
  const zoom = document.getElementById("zoom");

  /** Le document du carnet voyage en JSON : un <script> ne décode pas les entités. */
  const source = JSON.parse(document.getElementById("doc-source").textContent);
  /** Les deux PDF, en base64, produits au même moment que cette page. */
  /**
   * Les deux PDF pèsent près de 8 Mo de base64. Les analyser au chargement
   * gelait le fil principal avant même que la première page s'affiche — sur un
   * panneau étroit, la barre paraissait morte et le bouton d'export sans effet.
   * On ne paie donc la lecture qu'au premier export, et une seule fois.
   */
  let pdfCache = null;
  function pdfs() {
    pdfCache ??= JSON.parse(JSON.parse(document.getElementById("pdf-source").textContent));
    return pdfCache;
  }

  let doc = null;
  let outline = null;
  let pinned = null;
  let hovered = null;
  let pageEls = [];
  let current = 0;

  // --- Navigation ----------------------------------------------------------
  PAGES.forEach((page) => {
    const option = document.createElement("option");
    option.value = String(page.index);
    option.textContent = `${page.index + 1}. ${page.label} · ${page.layout}`;
    select.appendChild(option);
  });

  function goToPage(index) {
    const target = pageEls[index];
    if (!target) return;
    const scale = Number(zoom.value) / 100;
    const top = stageInner.getBoundingClientRect().top + window.scrollY + target.offsetTop * scale;
    window.scrollTo({ top: top - 56, behavior: "smooth" });
  }

  select.addEventListener("change", () => goToPage(Number(select.value)));
  document.getElementById("prev").addEventListener("click", () => goToPage(Math.max(0, current - 1)));
  document.getElementById("next").addEventListener("click", () =>
    goToPage(Math.min(PAGES.length - 1, current + 1)));

  function setCurrent(index) {
    current = index;
    counter.textContent = `${index + 1} / ${PAGES.length}`;
    select.value = String(index);
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("next").disabled = index === PAGES.length - 1;
  }

  // --- Échelle -------------------------------------------------------------
  function applyZoom() {
    const scale = Number(zoom.value) / 100;
    frame.style.transform = `scale(${scale})`;
    if (!doc) return;
    const height = doc.documentElement.scrollHeight;
    frame.style.height = `${height}px`;
    stageInner.style.width = `${560 * scale}px`;
    stageInner.style.height = `${height * scale}px`;
  }
  zoom.addEventListener("input", applyZoom);
  window.addEventListener("resize", applyZoom);

  /** Sur un panneau étroit, on part à une échelle qui montre la page entière. */
  function fitZoom() {
    const available = document.querySelector(".stage").clientWidth - 20;
    const value = Math.round(Math.min(110, Math.max(40, (available / 560) * 100)));
    zoom.value = String(value);
  }

  /**
   * Export PDF.
   *
   * Troisième chose que l'iframe d'artefact refuse, après `print()` et le
   * presse-papier : le téléchargement lui-même. Une iframe dont le `sandbox`
   * ne porte pas `allow-downloads` **exécute** le clic sur `<a download>`,
   * ne lève aucune erreur, et ne produit aucun fichier. Le bouton n'était donc
   * pas cassé — il était muet, ce qui revient au même pour qui l'utilise.
   *
   * Trois routes, de la plus directe à la plus manuelle, et surtout : on dit
   * ce qui s'est passé. Le silence était le vrai défaut.
   *
   *   1. `<a download>` — passe dès que la page est ouverte dans son onglet.
   *   2. `window.open` sur le blob — la visionneuse PDF du navigateur prend
   *      le relais, avec son propre bouton d'enregistrement.
   *   3. À défaut, on affiche la marche à suivre au lieu de ne rien dire.
   */
  const exportBtn = document.getElementById("export");
  const exportNote = document.getElementById("export-note");

  /** Encadrée dans le panneau latéral, la page n'a pas le droit de télécharger. */
  const framed = window.self !== window.top;

  function currentProfile() {
    return profiles.print.getAttribute("aria-pressed") === "true" ? "print" : "preview";
  }

  function showNote(html) {
    document.getElementById("export-note-text").innerHTML = html;
    exportNote.classList.add("is-open");
  }

  document.getElementById("export-note-close")?.addEventListener("click", () =>
    exportNote.classList.remove("is-open"));

  function decode(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  }

  exportBtn.addEventListener("click", () => {
    const profile = currentProfile();

    exportBtn.disabled = true;
    exportBtn.classList.add("is-busy");

    // Décoder 6 Mo de base64 fige le rendu une fraction de seconde : on rend
    // l'état occupé visible avant de s'y mettre.
    requestAnimationFrame(() => {
      let url;
      try {
        const base64 = pdfs()[profile];
        if (!base64) throw new Error(`aucun PDF embarqué pour le profil « ${profile} ».`);
        url = decode(base64);
      } catch (error) {
        // Le bouton dit ce qui a échoué au lieu de rester inerte.
        showNote(`<strong>Export impossible :</strong> ${error.message}`);
        exportBtn.disabled = false;
        exportBtn.classList.remove("is-busy");
        return;
      }

      const name = `memobook-${profile === "print" ? "imprimeur" : "apercu"}.pdf`;
      const link = document.createElement("a");
      link.href = url;
      link.download = name;
      document.body.appendChild(link);
      link.click();
      link.remove();

      exportBtn.disabled = false;
      exportBtn.classList.remove("is-busy");

      // Hors cadre, le téléchargement aboutit : rien à ajouter, et le blob peut
      // partir une fois le fichier écrit.
      if (!framed) {
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        return;
      }

      // Encadrée, la page ne peut pas savoir si le fichier est sorti — aucune
      // API ne le dit — et aucune route de repli ne tient. Toutes mesurées, pas
      // supposées : `window.open` sur le blob renvoie une fenêtre puis refuse
      // d'y naviguer, `showSaveFilePicker` est refusé aux cadres d'une autre
      // origine, `print()` demande `allow-modals`, `<embed>` et `<object>` ne
      // chargent pas. Seul `allow-downloads` compte, et l'activation
      // utilisateur n'y change rien.
      //
      // La note se contente donc de dire ce qui a été tenté et où trouver le
      // fichier autrement. Elle n'affirme pas un échec qu'elle ne peut pas
      // constater : la version précédente le faisait et se trompait dès que le
      // téléchargement aboutissait. Le blob survit tant que la note est ouverte.
      showNote(
        `<strong>${name}</strong> — export lancé, regarde tes téléchargements. ` +
          `Si rien n'arrive, c'est que cette page est affichée dans un cadre qui ` +
          `interdit d'écrire des fichiers : les deux PDF sont alors à récupérer ` +
          `dans les artefacts de la CI, ou par <code>npm run render:local</code>.`,
      );
    });
  });

  // --- Profil --------------------------------------------------------------
  const profiles = { preview: document.getElementById("p-preview"), print: document.getElementById("p-print") };
  function setProfile(name) {
    if (!doc) return;
    doc.body.classList.toggle("is-print", name === "print");
    profiles.preview.setAttribute("aria-pressed", String(name === "preview"));
    profiles.print.setAttribute("aria-pressed", String(name === "print"));
  }
  profiles.preview.addEventListener("click", () => setProfile("preview"));
  profiles.print.addEventListener("click", () => setProfile("print"));

  // --- Inspection ----------------------------------------------------------
  function describe(element) {
    let node = element;
    while (node && node !== doc.body) {
      for (const cls of node.classList) if (PARTS[cls]) return { node, key: cls, part: PARTS[cls] };
      node = node.parentElement;
    }
    return null;
  }

  function ancestry(node) {
    const chain = [];
    let cursor = node;
    while (cursor && cursor !== doc.body) {
      for (const cls of cursor.classList) {
        if (PARTS[cursor.classList.contains(cls) ? cls : cls]) { chain.unshift({ key: cls, node: cursor }); break; }
      }
      cursor = cursor.parentElement;
    }
    return chain.filter((step) => PARTS[step.key]);
  }

  /**
   * Sélecteur qui ne désigne qu'un seul élément du document.
   *
   * Une classe seule ne suffit pas : `.mb-card` apparaît sur plusieurs pages.
   * On remonte l'arbre en ajoutant des ancêtres jusqu'à ce que la requête ne
   * renvoie plus qu'un nœud — c'est la seule façon de nommer un élément « sans
   * aucun doute », ce que demande une consigne de retouche.
   */
  function uniqueSelector(node) {
    const parts = [];
    let el = node;

    while (el && el !== doc.body) {
      let part = el.classList.length
        ? "." + Array.from(el.classList).join(".")
        : el.tagName.toLowerCase();

      const parent = el.parentElement;
      if (parent) {
        const siblings = Array.from(parent.children).filter((c) => c.tagName === el.tagName);
        if (siblings.length > 1) part += `:nth-of-type(${siblings.indexOf(el) + 1})`;
      }

      parts.unshift(part);
      const selector = parts.join(" > ");
      if (doc.querySelectorAll(selector).length === 1) return selector;
      el = parent;
    }
    return parts.join(" > ");
  }

  function pageOf(node) {
    const index = pageEls.indexOf(node.closest(".page"));
    return index === -1 ? null : index;
  }

  function moveOutline(node, isPinned) {
    if (!outline) return;
    const rect = node.getBoundingClientRect();
    outline.style.display = "block";
    outline.classList.toggle("is-pinned", Boolean(isPinned));
    outline.style.left = `${rect.left + doc.defaultView.scrollX - 1.5}px`;
    outline.style.top = `${rect.top + doc.defaultView.scrollY - 1.5}px`;
    outline.style.width = `${rect.width}px`;
    outline.style.height = `${rect.height}px`;
  }

  /**
   * Copie le sélecteur.
   *
   * `navigator.clipboard` est refusé dans une iframe sans permission explicite.
   * On tente l'API, puis la commande historique, et en dernier recours on
   * affiche le texte : mieux vaut deux gestes qu'un bouton qui ne fait rien.
   */
  function copyText(text, button, box, area) {
    const done = () => {
      button.dataset.state = "done";
      button.textContent = "Copié";
      setTimeout(() => { button.dataset.state = ""; button.textContent = "Copier le sélecteur"; }, 1600);
    };
    const legacy = () => {
      const t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
      document.body.appendChild(t);
      t.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      t.remove();
      return ok;
    };
    const reveal = () => {
      area.value = text;
      box.classList.add("is-shown");
      area.focus();
      area.select();
      button.textContent = "Sélectionne puis copie";
    };

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => { if (legacy()) done(); else reveal(); });
      return;
    }
    if (legacy()) done(); else reveal();
  }

  function chipList(className, label, values) {
    if (!values || values.length === 0) return "";
    return `<div class="field ${className}"><span class="eyebrow">${label}</span><ul>` +
      values.map((v) => `<li><code>${v}</code></li>`).join("") + "</ul></div>";
  }

  function close() {
    dock.classList.remove("is-open", "is-expanded");
    pinned = null;
    if (outline) outline.style.display = "none";
  }
  document.getElementById("close").addEventListener("click", close);

  function render(found) {
    const part = found.part;
    const page = pageOf(found.node);
    const selector = uniqueSelector(found.node);

    panelTitle.textContent = part.name;
    panelKind.textContent = part.kind;
    panelKind.dataset.kind = part.kind;

    body.innerHTML =
      `<span class="eyebrow">${page === null ? "" : `Page ${page + 1} / ${PAGES.length} · ${PAGES[page].label}`}</span>` +
      `<code class="sel" id="sel"></code>` +
      `<div class="row">` +
        `<button type="button" class="copy" id="copy">Copier le sélecteur</button>` +
        `<button type="button" class="more" id="more">Voir plus</button>` +
      `</div>` +
      `<div class="fallback" id="fallback"><textarea id="fallback-text" readonly></textarea></div>` +
      `<div class="detail">` +
        `<p class="role"></p>` +
        chipList("json", "Champs du JSON", part.fields) +
        chipList("vars", "Variables CSS", part.vars) +
        `<div class="field"><span class="eyebrow">Contexte</span><div class="ancestry" id="chain"></div></div>` +
      `</div>`;

    body.querySelector("#sel").textContent = selector;
    body.querySelector(".role").textContent = part.role;

    const chainBox = body.querySelector("#chain");
    ancestry(found.node).forEach((step, i) => {
      if (i > 0) {
        const sep = document.createElement("span");
        sep.textContent = "›";
        chainBox.appendChild(sep);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = PARTS[step.key].name;
      b.addEventListener("click", () => {
        pinned = { node: step.node, key: step.key, part: PARTS[step.key] };
        render(pinned);
        moveOutline(step.node, true);
      });
      chainBox.appendChild(b);
    });

    const more = body.querySelector("#more");
    more.addEventListener("click", () => {
      dock.classList.toggle("is-expanded");
      more.textContent = dock.classList.contains("is-expanded") ? "Voir moins" : "Voir plus";
    });
    more.textContent = dock.classList.contains("is-expanded") ? "Voir moins" : "Voir plus";

    const copy = body.querySelector("#copy");
    copy.addEventListener("click", () =>
      copyText(selector, copy, body.querySelector("#fallback"), body.querySelector("#fallback-text")));
  }

  // --- Chargement ----------------------------------------------------------
  frame.addEventListener("load", () => {
    doc = frame.contentDocument;
    outline = doc.getElementById("mb-outline");
    pageEls = Array.from(doc.querySelectorAll(".page"));

    // Numéro sur chaque feuille : posé ici, pas dans le gabarit, qui doit
    // rester exactement ce qui part chez APITemplate.
    const style = doc.createElement("style");
    style.textContent =
      ".mb-pagenum{position:absolute;z-index:9;left:0;right:0;bottom:9px;text-align:center;" +
      "font:600 8px/1 ui-monospace,monospace;letter-spacing:.16em;color:rgba(43,35,27,.34);" +
      "pointer-events:none}";
    doc.head.appendChild(style);
    pageEls.forEach((page, i) => {
      const tag = doc.createElement("div");
      tag.className = "mb-pagenum";
      tag.textContent = `${i + 1} / ${pageEls.length}`;
      page.appendChild(tag);
    });

    fitZoom();
    applyZoom();
    setCurrent(0);

    // Survol : contour seul. La modal ne s'ouvre qu'au clic, pour ne pas
    // clignoter à chaque passage de souris au-dessus de la page.
    doc.addEventListener("mousemove", (event) => {
      const found = describe(event.target);
      if (!found || hovered === found.node) return;
      hovered = found.node;
      if (!pinned) moveOutline(found.node, false);
    });

    doc.addEventListener("click", (event) => {
      const found = describe(event.target);
      if (!found) return;
      event.preventDefault();
      pinned = found;
      dock.classList.add("is-open");
      render(found);
      moveOutline(found.node, true);
    });

    doc.addEventListener("mouseleave", () => {
      if (!pinned && outline) outline.style.display = "none";
    });

    const track = () => {
      const scale = Number(zoom.value) / 100;
      const origin = stageInner.getBoundingClientRect().top;
      let index = 0;
      pageEls.forEach((page, i) => { if (origin + page.offsetTop * scale < 120) index = i; });
      if (index !== current) setCurrent(index);
    };
    window.addEventListener("scroll", track, { passive: true });
    track();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") close();
  });

  frame.srcdoc = source;
})();
</script>
