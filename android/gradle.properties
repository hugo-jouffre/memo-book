org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# L'adresse de production, écrite une seule fois — comme `ios/Config/Base.xcconfig`.
# Le build Release la prend pour adresse ; le build Debug la garde en secours
# (voir `ApiConfiguration.effective`).
memobook.productionApiBaseUrl=https://api-production-9f35a.up.railway.app

# L'identifiant client **web** de Google : l'audience des jetons d'identité que
# « Continuer avec Google » rend, et que le serveur vérifie
# (`GOOGLE_WEB_CLIENT_ID`, lot B1). Ce n'est pas un secret — il part dans chaque
# APK, comme le client OAuth d'iOS. Il se lit dans la Google Cloud Console du
# projet MemoBook, *API et services ▸ Identifiants ▸ ID clients OAuth 2.0*,
# ligne « Application Web » (`….apps.googleusercontent.com`). Le client
# **Android** du même projet (nom de paquet + SHA-1, lot A0) doit exister à
# côté, sans quoi Google refuse la demande. **Vide : le bouton Google ne
# s'affiche pas** — ni ce client ni la variable du serveur n'existent encore.
memobook.googleWebClientId=

# Le Services ID d'Apple (`com.memobook.app.signin`, par exemple), groupé sous
# l'App ID `com.memobook.app` pour qu'Apple rende le même identifiant que sur
# l'iPhone — voir `AppleSignInService`. Il se crée dans
# *Certificates, Identifiers & Profiles ▸ Identifiers ▸ Services IDs* (lot A0),
# et le serveur doit l'accepter comme audience (lot B2). **Vide : le bouton
# Apple ne s'affiche pas.**
memobook.appleServicesId=
