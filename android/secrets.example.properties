# Modèle de `android/secrets.properties`, le fichier local ignoré par Git.
# Le copier, le renommer, et décommenter ce qui sert — son absence ne casse rien.
#
# Sur un téléphone branché, un build Debug parle à la production : l'adresse de
# l'émulateur (10.0.2.2) n'y mène nulle part, et `ApiConfiguration.effective`
# la remplace. Pour viser le back-end du Mac depuis le téléphone, poser ici
# l'IP du Mac sur le Wi-Fi (Réglages Système ▸ Wi-Fi ▸ Détails) :
#
# MEMOBOOK_API_BASE_URL=http://192.168.1.20:3000
#
# L'émulateur prend alors cette adresse lui aussi — elle n'est pas une boucle
# locale. Retirer la ligne pour lui rendre le Mac à 10.0.2.2.
