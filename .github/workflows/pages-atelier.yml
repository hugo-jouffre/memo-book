# Publie l'atelier carnet sur GitHub Pages.
#
# Le dossier `MemoBook Generator/public/` est un site statique complet : sans
# serveur, la page appelle les APIs directement avec la clé du visiteur. Il n'y
# a donc rien à construire, et aucun secret dans ce workflow — il n'en faut
# aucun, et il ne faut surtout pas en ajouter.
name: Atelier carnet — publication

on:
  push:
    branches: [main]
    paths:
      - "MemoBook Generator/public/**"
      - ".github/workflows/pages-atelier.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une publication à la fois, sans annuler celle qui est en cours de route.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe des scripts publiés
        run: |
          for fichier in "MemoBook Generator"/public/*.js; do
            node --check "$fichier"
          done

      - name: Refuser de publier une clé
        # Un `sk-…` commité partirait en ligne sans que personne le voie.
        run: |
          if grep -rInE 'sk-[A-Za-z0-9_-]{20,}' "MemoBook Generator/public/"; then
            echo "Une clé d'API traîne dans le dossier publié." >&2
            exit 1
          fi

      - name: Estampiller la version
        # Chaque publication change l'adresse des scripts (`app.js?v=<commit>`) :
        # le navigateur ne peut plus resservir un ancien `app.js` de son cache.
        # Le carnet du 06/10 a été généré quatre heures après une fusion avec
        # l'ancien code — météo et pastille comprises. Le commit s'affiche
        # aussi dans l'en-tête de l'atelier, pour qu'on puisse le vérifier.
        run: |
          version="${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/${version}/g" "MemoBook Generator/public/index.html"
          grep -q "app.js?v=${version}" "MemoBook Generator/public/index.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: MemoBook Generator/public

      - id: deploiement
        uses: actions/deploy-pages@v4
