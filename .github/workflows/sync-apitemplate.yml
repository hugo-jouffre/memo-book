name: Sync APITemplate template

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'templates/travel-journal/index.html'
      - 'templates/travel-journal/style.css'
      - 'templates/travel-journal/fonts.css'

jobs:
  sync-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Le contexte `secrets` n'existe PAS dans un `if:` de job : GitHub refuse
      # d'évaluer l'expression et le run échoue instantanément, sans exécuter
      # le moindre job. La garde doit donc vivre au niveau d'une étape, où le
      # contexte est disponible. Tant que le secret n'est pas posé, le job
      # reste vert et la synchronisation est simplement ignorée.
      - name: Le secret est-il posé ?
        id: guard
        env:
          APITEMPLATE_API_KEY: ${{ secrets.APITEMPLATE_API_KEY }}
        run: |
          if [ -z "${APITEMPLATE_API_KEY}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APITEMPLATE_API_KEY absent, synchronisation ignorée. Pose le secret dans Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update APITemplate template
        if: steps.guard.outputs.configured == 'true'
        env:
          APITEMPLATE_API_KEY: ${{ secrets.APITEMPLATE_API_KEY }}
          APITEMPLATE_TEMPLATE_ID: ${{ secrets.APITEMPLATE_TEMPLATE_ID }}
          # Le compte MemoBook est en région DE. Appeler rest.apitemplate.io
          # renverrait une erreur d'authentification difficile à diagnostiquer.
          APITEMPLATE_BASE_URL: ${{ vars.APITEMPLATE_BASE_URL || 'https://rest-de.apitemplate.io/v2' }}
        run: |
          set -euo pipefail

          # `fonts.css` porte les @font-face inlinés en base64, `style.css` le
          # reste. APITemplate ne reçoit qu'un seul champ `css` : on concatène
          # exactement comme le fait loadTemplateCss() côté back-end, sinon le
          # rendu de production perdrait ses polices.
          cat templates/travel-journal/fonts.css \
              templates/travel-journal/style.css > /tmp/memobook.css

          HTML=$(jq -Rs . < templates/travel-journal/index.html)
          CSS=$(jq -Rs . < /tmp/memobook.css)

          PAYLOAD=$(jq -n \
            --arg template_id "$APITEMPLATE_TEMPLATE_ID" \
            --argjson body "$HTML" \
            --argjson css "$CSS" \
            '{template_id: $template_id, body: $body, css: $css}')

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl --show-error --silent --max-time 60 \
            -X POST "${APITEMPLATE_BASE_URL}/update-template" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: $APITEMPLATE_API_KEY" \
            -d "$PAYLOAD" \
            -w "%{http_code}" \
            -o "$RESPONSE_FILE")
          echo "APITemplate response (HTTP ${HTTP_STATUS}):"
          cat "$RESPONSE_FILE"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            exit 1
          fi
